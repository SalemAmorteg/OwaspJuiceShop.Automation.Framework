name: Dual-Language QA Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Ensure these exact three values are set globally at the top level
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # --- PYTHON AUTOMATION JOB ---
  python-tests:
    name: Playwright Python (Primary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f python/requirements.txt ]; then
            pip install -r python/requirements.txt
          else
            echo "requirements.txt not found yet, installing baseline"
            pip install pytest-playwright allure-pytest
          fi

      - name: Ensure Playwright Browsers
        run: playwright install --with-deps chromium

      - name: Run Python Tests
        run: |
          mkdir -p unified-allure-results
          if [ -d "python/tests" ]; then
            pytest python/tests --alluredir=unified-allure-results
          else
            echo "No python tests structured yet."
          fi
        continue-on-error: true 

      - name: Upload Python Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-results
          path: unified-allure-results
          if-no-files-found: ignore

  # --- C# AUTOMATION JOB ---
  csharp-tests:
    name: Playwright C# (Platform E2E)
    runs-on: ubuntu-latest
    
    services:
      juice-shop:
        image: bkimminich/juice-shop:v16.0.0
        ports:
          - 3000:3000

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore csharp/OwaspJuiceShop.Tests.sln

      - name: Install Playwright Browsers
        run: |
          dotnet build csharp/OwaspJuiceShop.Tests.sln
          pwsh csharp/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Verify Service Availability
        run: |
          echo "Waiting for Juice Shop endpoint to wake up..."
          timeout 30s bash -c 'until printf "" 2>>/dev/null >/dev/tcp/127.0.0.1/3000; do sleep 1; done' || true

      - name: Run C# Tests
        # FIX 1: Explicitly pass the Environment Token mapping directly to your BasePage configuration structure
        env:
          AutomationSettings__BaseUrl: "http://127.0.0.1:3000"
        run: dotnet test csharp/OwaspJuiceShop.Tests.sln --no-restore --logger:"trx;LogFileName=csharp-results.trx"
        continue-on-error: true

      - name: Upload C# Raw Allure Results
        # FIX 2: Target the actual binary folder location where BaseTest outputs screenshots, traces, and JSON results
        uses: actions/upload-artifact@v4
        with:
          name: csharp-results
          path: csharp/bin/Debug/net10.0/allure-results
          if-no-files-found: ignore

  # --- REPORTING JOB ---
  generate-report:
    name: Allure Reporting
    needs: [python-tests, csharp-tests]
    runs-on: ubuntu-latest
    if: always()
    
    # Target the official GitHub Pages deployment environment natively

    steps:
      - name: Create Consolidation Directory
        run: mkdir -p combined-allure-results

      - name: Download Python Artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-results
          path: combined-allure-results
        continue-on-error: true

      - name: Download C# Artifacts
        uses: actions/download-artifact@v4
        with:
          name: csharp-results
          path: combined-allure-results
        continue-on-error: true

      - name: Checkout gh-pages for History
        # We still use checkout to grab historical trends if they exist
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true
        
      - name: Load Allure History
        run: |
          mkdir -p combined-allure-results/history
          cp -r gh-pages/history/* combined-allure-results/history/ 2>/dev/null || true

      - name: Compile Unified Allure Dashboard
        uses: simple-elf/allure-report-action@master
        id: allure-report
        with:
          allure_results: combined-allure-results
          allure_report: allure-report
          allure_history: allure-history

      # -------------------------------------------------------------
      # FIX: Official Native GitHub Pages Deployment Pipeline
      # -------------------------------------------------------------
      
      - name: Setup Pages Infrastructure
        uses: actions/configure-pages@v5

      - name: Upload HTML Directory as Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Tell GitHub to compress our newly generated html report folder
          path: allure-report

      - name: Deploy Compiled Report Natively to Cloud
        id: deployment
        uses: actions/deploy-pages@v4