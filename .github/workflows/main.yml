name: Dual-Language QA Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # --- PYTHON AUTOMATION JOB ---
  python-tests:
    name: Playwright Python (Primary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f python/requirements.txt ]; then
            pip install -r python/requirements.txt
          else
            echo "requirements.txt not found yet, installing baseline"
            pip install pytest-playwright allure-pytest
          fi

      - name: Ensure Playwright Browsers
        run: playwright install --with-deps chromium

      - name: Run Python Tests
        # Added a fallback execution check so it won't crash if Miguel's folder is empty
        run: |
          mkdir -p allure-results
          if [ -d "python/tests" ]; then
            pytest python/tests --alluredir=allure-results
          else
            echo "No python tests structured yet."
          fi
        continue-on-error: true 

      - name: Upload Python Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-results
          path: allure-results
          if-no-files-found: ignore # Prevents warnings/failures if empty

  # --- C# AUTOMATION JOB ---
  csharp-tests:
    name: Playwright C# (Platform E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore csharp/OwaspJuiceShop.Tests.sln

      - name: Install Playwright Browsers
        run: |
          dotnet build csharp/OwaspJuiceShop.Tests.sln
          pwsh csharp/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run C# Tests
        # FIXED: Removed the arguments that cause parsing errors under .NET 10 in Linux runners
        run: dotnet test csharp/OwaspJuiceShop.Tests.sln --no-restore --logger:"trx;LogFileName=csharp-results.trx"
        continue-on-error: true

      - name: Upload C# Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: csharp-results
          path: csharp/TestResults
          if-no-files-found: ignore

  # --- REPORTING JOB ---
  generate-report:
    name: Allure Reporting
    needs: [python-tests, csharp-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        
      - name: Consolidate Results
        run: echo "Ready to aggregate Python and C# results into a unified dashboard."