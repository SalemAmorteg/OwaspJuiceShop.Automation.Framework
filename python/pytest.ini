[pytest]
# Path Management
pythonpath = .
testpaths = tests

# Execution Defaults
# REMOVED: --playwright-process-reuse
addopts = 
    --base-url=http://localhost:3000
    --browser=chromium
    --headed
    --strict-markers
    --tb=short

# Custom Markers
markers =
    ui: UI-level functional tests
    smoke: Critical path E2E flows
